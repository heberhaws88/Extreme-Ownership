name: Extreme Ownership Wired — Weekly Episode

on:
  schedule:
    # Runs 5:00 AM Mountain Time every Monday (adjust the UTC offset for daylight saving as needed).
    # 11:00 UTC = 5:00 AM MDT / 4:00 AM MST — verify against your BOM-Study schedule's offset.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab for testing

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extreme-ownership-wired
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install anthropic openai pydub

      - name: Generate this week's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_episode.py

      - name: Commit and push new episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed/ data/
          git diff --staged --quiet || git commit -m "Add weekly Extreme Ownership: Wired episode"
          git push
